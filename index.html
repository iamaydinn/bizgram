<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BizimGram Pro Max</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet">
    
    <style>
        /* CSS AYARLARI */
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fff; color: #262626; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .screen { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding-bottom: 50px; background: #fff; }
        .screen.active { display: flex; }
        
        .btn-primary { background: #0095f6; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; width: 100%; cursor: pointer; font-size: 14px; }
        .btn-secondary { background: #efefef; color: #262626; border: 1px solid #dbdbdb; padding: 10px; border-radius: 6px; font-weight: 600; width: 100%; cursor: pointer; font-size: 14px; }
        
        .custom-input { width: 100%; padding: 12px; border: 1px solid #dbdbdb; border-radius: 6px; background: #fafafa; font-size: 14px; margin-bottom: 10px; }
        
        .app-header { height: 50px; border-bottom: 1px solid #dbdbdb; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #fff; z-index: 10; position: sticky; top: 0; }
        .logo { font-family: 'Cursive', serif; font-size: 24px; font-weight: bold; margin-top: 5px; }

        /* Profil Stilleri */
        .profile-top { padding: 20px 15px 0; display: flex; align-items: center; }
        .profile-pic-lg { width: 80px; height: 80px; border-radius: 50%; margin-right: 20px; object-fit: cover; border: 1px solid #dbdbdb; }
        .profile-stats { flex: 1; display: flex; justify-content: space-around; text-align: center; }
        .stat-num { font-weight: bold; font-size: 18px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; border-top: 1px solid #dbdbdb; margin-top:10px; }
        .grid-item { position: relative; padding-bottom: 100%; background: #eee; }
        .grid-item img { position: absolute; width: 100%; height: 100%; object-fit: cover; }

        /* Stories */
        .stories-bar { padding: 10px 0; border-bottom: 1px solid #efefef; overflow-x: auto; display: flex; scrollbar-width: none; }
        .story-item { display: flex; flex-direction: column; align-items: center; margin-left: 15px; cursor: pointer; flex-shrink: 0; width: 70px; }
        .story-ring { width: 68px; height: 68px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); display: flex; align-items: center; justify-content: center; position: relative; }
        .story-avatar { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff; object-fit: cover; }

        /* Post */
        .post { margin-bottom: 10px; border-bottom: 1px solid #efefef; padding-bottom: 10px; }
        .post-header { padding: 10px; display: flex; align-items: center; }
        .user-avatar-small { width: 32px; height: 32px; border-radius: 50%; margin-right: 10px; object-fit: cover; border: 1px solid #eee; }
        .post-img { width: 100%; display: block; min-height: 250px; background: #f0f0f0; object-fit: cover; }

        /* Chat */
        .chat-bubble { padding: 10px 14px; border-radius: 18px; max-width: 75%; font-size: 14px; margin-bottom: 6px; word-wrap: break-word; }
        .chat-me { align-self: flex-end; background: #3797f0; color: white; }
        .chat-you { align-self: flex-start; background: #efefef; color: black; }

        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 500; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0095f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 200; flex-direction: column; }
        .modal-header { padding: 0 15px; height: 50px; border-bottom: 1px solid #dbdbdb; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        
        .bottom-nav { height: 50px; border-top: 1px solid #dbdbdb; display: flex; justify-content: space-around; align-items: center; background: #fff; position: fixed; bottom: 0; width: 100%; z-index: 100; }
    </style>
</head>
<body>

    <div id="loading-overlay" class="loading-overlay"><div class="spinner"></div><div id="loading-text" style="margin-top:10px; font-weight:600;">Yükleniyor...</div></div>

    <div id="screen-auth" class="screen active" style="justify-content:center; padding:40px;">
        <h1 style="font-family: 'Cursive', serif; font-size: 45px; margin-bottom:30px; text-align:center;">BizimGram</h1>
        <input type="email" id="auth-email" class="custom-input" placeholder="E-posta">
        <input type="password" id="auth-pass" class="custom-input" placeholder="Şifre">
        <button onclick="authAction('login')" class="btn-primary" style="margin-bottom:10px;">Giriş Yap</button>
        <button onclick="authAction('signup')" class="btn-secondary">Kayıt Ol</button>
    </div>

    <div id="screen-home" class="screen">
        <div class="app-header">
            <div class="logo">BizimGram</div>
            <span class="material-icons-outlined" onclick="navTo('screen-dm-list')" style="font-size:28px; cursor:pointer;">near_me</span>
        </div>
        <div class="stories-bar" id="stories-wrapper">
            <div class="story-item" onclick="openUpload('story')">
                <div class="story-ring" style="background:transparent; border:1px solid #ddd;">
                    <img id="my-story-avatar" src="https://via.placeholder.com/60" class="story-avatar">
                </div>
                <div style="font-size:11px; margin-top:5px;">Hikayen</div>
            </div>
            <div id="stories-list" style="display:flex;"></div>
        </div>
        <div id="feed-container"></div>
    </div>

    <div id="screen-my-profile" class="screen">
        <div class="app-header">
            <span style="font-weight:bold;" id="header-username">...</span>
            <span class="material-icons-outlined" onclick="logout()">logout</span>
        </div>
        <div class="profile-top">
            <img id="profile-img-main" src="https://via.placeholder.com/150" class="profile-pic-lg">
            <div class="profile-stats">
                <div><span class="stat-num" id="stat-posts">0</span>Gönderi</div>
                <div><span class="stat-num" id="stat-followers">0</span>Takipçi</div>
                <div><span class="stat-num" id="stat-following">0</span>Takip</div>
            </div>
        </div>
        <div style="padding:0 15px 10px;">
            <div style="font-weight:bold;" id="bio-fullname"></div>
            <div style="white-space:pre-wrap;" id="bio-text"></div>
        </div>
        <div style="padding:0 15px;">
            <div class="btn-secondary" onclick="openEditModal()" style="text-align:center;">Profili Düzenle</div>
        </div>
        <div class="grid-container" id="profile-grid"></div>
    </div>

    <div id="screen-user-profile" class="screen">
        <div class="app-header">
            <span class="material-icons" onclick="navTo('screen-search')">arrow_back</span>
            <b id="user-header-username">Kullanıcı</b>
            <span></span>
        </div>
        <div class="profile-top">
            <img id="user-img-main" src="https://via.placeholder.com/150" class="profile-pic-lg">
            <div class="profile-stats">
                <div><span class="stat-num" id="user-stat-posts">0</span>Gönderi</div>
                <div><span class="stat-num" id="user-stat-followers">0</span>Takipçi</div>
                <div><span class="stat-num" id="user-stat-following">0</span>Takip</div>
            </div>
        </div>
        <div style="padding:0 15px 10px;">
            <div style="font-weight:bold;" id="user-bio-fullname"></div>
            <div style="white-space:pre-wrap;" id="user-bio-text"></div>
        </div>
        
        <div style="padding:0 15px;">
            <button id="btn-follow-action" class="btn-primary" onclick="toggleFollow()">Takip Et</button>
        </div>

        <div class="grid-container" id="user-profile-grid"></div>
    </div>

    <div id="screen-search" class="screen">
        <div style="padding:10px;"><input type="text" oninput="doSearch(this.value)" class="custom-input" placeholder="Ara..."></div>
        <div id="search-results"></div>
    </div>

    <div id="modal-edit" class="modal">
        <div class="modal-header">
            <span onclick="closeModal('modal-edit')">İptal</span><span>Profili Düzenle</span><span onclick="saveProfile()" style="color:#0095f6; font-weight:bold;">Bitti</span>
        </div>
        <div style="padding:20px; text-align:center;">
            <img id="edit-preview" src="" style="width:100px; height:100px; border-radius:50%; margin-bottom:15px; object-fit:cover;">
            <div style="color:#0095f6; font-weight:600; margin-bottom:20px;" onclick="document.getElementById('edit-file').click()">Fotoğrafı Değiştir</div>
            <input type="file" id="edit-file" hidden accept="image/*">
            <input type="text" id="edit-fullname" class="custom-input" placeholder="Ad Soyad">
            <input type="text" id="edit-username" class="custom-input" placeholder="Kullanıcı Adı">
            <textarea id="edit-bio" class="custom-input" rows="3" placeholder="Biyografi"></textarea>
        </div>
    </div>

    <div id="modal-upload" class="modal">
        <div class="modal-header">
            <span onclick="closeModal('modal-upload')">Kapat</span><b>Paylaş</b><span onclick="performUpload()" style="color:#0095f6; font-weight:bold;">Paylaş</span>
        </div>
        <div style="flex:1; background:#000; display:flex; align-items:center; justify-content:center;"><img id="upload-preview" style="max-width:100%; max-height:100%;"></div>
        <input type="text" id="upload-caption" placeholder="Bir açıklama yaz..." style="padding:15px; border:none; width:100%;">
        <input type="file" id="upload-file" hidden accept="image/*">
    </div>

    <div id="screen-dm-list" class="screen">
        <div class="app-header"><span class="material-icons" onclick="navTo('screen-home')">arrow_back</span><b>Mesajlar</b><span></span></div>
        <div id="dm-list-container" style="padding:20px; text-align:center; color:#999;"></div>
    </div>

    <div id="modal-chat" class="modal" style="z-index:300;">
        <div class="modal-header">
            <span class="material-icons" onclick="closeModal('modal-chat')">arrow_back</span>
            <b id="chat-header-name">Chat</b>
            <span></span>
        </div>
        <div id="chat-messages" style="flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column;"></div>
        <div style="padding:10px; border-top:1px solid #eee; display:flex;">
            <input id="chat-input" class="custom-input" style="border-radius:20px; margin:0;" placeholder="Mesaj...">
            <button onclick="sendChatMessage()" style="border:none; background:none; color:#0095f6; font-weight:bold; margin-left:10px;">GÖNDER</button>
        </div>
    </div>

    <div class="bottom-nav" id="bottom-nav" style="display:none;">
        <span class="material-icons nav-icon" onclick="navTo('screen-home')">home</span>
        <span class="material-icons nav-icon" onclick="navTo('screen-search')">search</span>
        <span class="material-icons-outlined nav-icon" onclick="openUpload('post')">add_box</span>
        <span class="material-icons nav-icon" onclick="openMyProfile()">person</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, getDoc, getDocs, where, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // IMGBB API
        const IMGBB_API_KEY = "4e42bfb4bfa830f09e932aa64cc20bb6"; 

        const firebaseConfig = {
            apiKey: "AIzaSyA90T44N_om_KnTs3Wg06m8pBry0L20nVw",
            authDomain: "sosyal-medya-a46b6.firebaseapp.com",
            projectId: "sosyal-medya-a46b6",
            storageBucket: "sosyal-medya-a46b6.firebasestorage.app",
            messagingSenderId: "990331063740",
            appId: "1:990331063740:web:e18de69584fc82825aafb9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = {};
        let uploadType = 'post';
        let activeChatUid = null;
        let viewedUserUid = null; // Şu an profilini incelediğimiz kişi

        const showLoading = (t) => { document.getElementById('loading-text').innerText = t; document.getElementById('loading-overlay').style.display = 'flex'; };
        const hideLoading = () => document.getElementById('loading-overlay').style.display = 'none';

        // ImgBB Upload
        const uploadToImgBB = async (file) => {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const data = await response.json();
            if(data.success) return data.data.url;
            throw new Error("Resim yüklenemedi.");
        };

        // Auth
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) { userData = docSnap.data(); updateMyProfileUI(); }
                });
                document.getElementById('screen-auth').classList.remove('active');
                document.getElementById('bottom-nav').style.display = 'flex';
                navTo('screen-home');
                loadFeed(); loadStories();
            } else {
                document.getElementById('bottom-nav').style.display = 'none';
                navTo('screen-auth');
            }
        });

        function updateMyProfileUI() {
            const pic = userData.photoURL || "https://via.placeholder.com/150";
            document.getElementById('my-story-avatar').src = pic;
            document.getElementById('profile-img-main').src = pic;
            document.getElementById('header-username').innerText = userData.username || "Kullanıcı";
            document.getElementById('bio-fullname').innerText = userData.fullname || "";
            document.getElementById('bio-text').innerText = userData.bio || "";
        }

        window.authAction = async (type) => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            if(!email || !pass) return alert("Bilgileri girin");
            showLoading("İşlem yapılıyor...");
            try {
                if(type === 'login') await signInWithEmailAndPassword(auth, email, pass);
                else {
                    const cred = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", cred.user.uid), {
                        uid: cred.user.uid, email, username: email.split('@')[0],
                        fullname: '', bio: '', photoURL: "https://via.placeholder.com/150"
                    }, { merge: true });
                }
            } catch(e) { alert("Hata: " + e.message); } finally { hideLoading(); }
        };

        window.logout = () => signOut(auth);

        // --- PROFİL GÖRÜNTÜLEME & TAKİP ---
        window.openUserProfile = async (targetUid) => {
            if(targetUid === currentUser.uid) { openMyProfile(); return; }
            
            viewedUserUid = targetUid;
            navTo('screen-user-profile');
            showLoading("Profil yükleniyor...");

            try {
                // Kullanıcı bilgilerini çek
                const uSnap = await getDoc(doc(db, "users", targetUid));
                const uData = uSnap.data();

                document.getElementById('user-header-username').innerText = uData.username;
                document.getElementById('user-img-main').src = uData.photoURL;
                document.getElementById('user-bio-fullname').innerText = uData.fullname;
                document.getElementById('user-bio-text').innerText = uData.bio;

                // Takip durumunu kontrol et (Ben bu kişiyi takip ediyor muyum?)
                // Takip ID mantığı: ben_hedef
                const relId = `${currentUser.uid}_${targetUid}`;
                const relSnap = await getDoc(doc(db, "relationships", relId));
                
                updateFollowButton(relSnap.exists());

                // Gönderilerini çek
                const q = query(collection(db, "posts"), where("uid", "==", targetUid), orderBy("date", "desc"));
                const pSnap = await getDocs(q);
                document.getElementById('user-stat-posts').innerText = pSnap.size;
                
                const grid = document.getElementById('user-profile-grid');
                grid.innerHTML = "";
                pSnap.forEach(d => {
                    grid.innerHTML += `<div class="grid-item"><img src="${d.data().imageUrl}"></div>`;
                });

            } catch(e) { console.error(e); } finally { hideLoading(); }
        };

        function updateFollowButton(isFollowing) {
            const btn = document.getElementById('btn-follow-action');
            if(isFollowing) {
                btn.innerText = "Mesaj Gönder";
                btn.className = "btn-secondary";
                btn.onclick = () => openChat(viewedUserUid, document.getElementById('user-header-username').innerText);
            } else {
                btn.innerText = "Takip Et";
                btn.className = "btn-primary";
                btn.onclick = toggleFollow;
            }
        }

        window.toggleFollow = async () => {
            const relId = `${currentUser.uid}_${viewedUserUid}`;
            const btn = document.getElementById('btn-follow-action');
            
            if(btn.innerText === "Takip Et") {
                // Takip etmeye başla
                await setDoc(doc(db, "relationships", relId), {
                    follower: currentUser.uid,
                    following: viewedUserUid,
                    date: serverTimestamp()
                });
                updateFollowButton(true);
            }
        };

        // --- KENDİ PROFİLİM ---
        window.openMyProfile = async () => {
            navTo('screen-my-profile');
            onSnapshot(query(collection(db, "posts"), where("uid", "==", currentUser.uid), orderBy("date", "desc")), (snap) => {
                document.getElementById('stat-posts').innerText = snap.size;
                const grid = document.getElementById('profile-grid');
                grid.innerHTML = "";
                snap.forEach(d => grid.innerHTML += `<div class="grid-item"><img src="${d.data().imageUrl}"></div>`);
            });
        };

        // --- ARAMA ---
        window.doSearch = async (val) => {
            if(val.length < 1) return;
            const div = document.getElementById('search-results'); div.innerHTML = "";
            const snap = await getDocs(collection(db, "users"));
            snap.forEach(d => {
                const u = d.data();
                if(u.username && u.username.toLowerCase().includes(val.toLowerCase()) && u.uid !== currentUser.uid) {
                    // TIKLAYINCA ARTIK PROFİLE GİDİYOR
                    div.innerHTML += `
                        <div onclick="openUserProfile('${u.uid}')" style="padding:15px; border-bottom:1px solid #eee; display:flex; align-items:center;">
                            <img src="${u.photoURL}" class="user-avatar-small">
                            <span style="font-weight:bold;">${u.username}</span>
                        </div>
                    `;
                }
            });
        };

        // --- CHAT SİSTEMİ (DÜZELTİLDİ) ---
        window.openChat = (uid, name) => {
            activeChatUid = uid;
            document.getElementById('chat-header-name').innerText = name;
            document.getElementById('modal-chat').style.display = 'flex';
            
            // CHAT ID: İki ID'yi alfabetik sıraya göre birleştir (A_B)
            // Bu sayede A kişisi de B kişisi de aynı odaya bağlanır.
            const ids = [currentUser.uid, uid].sort();
            const chatId = ids.join("_");

            onSnapshot(query(collection(db, "chats", chatId, "messages"), orderBy("date", "asc")), (snap) => {
                const div = document.getElementById('chat-messages');
                div.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    div.innerHTML += `<div class="chat-bubble ${m.sender===currentUser.uid ? 'chat-me' : 'chat-you'}">${m.text}</div>`;
                });
                div.scrollTop = div.scrollHeight;
            });
        };

        window.sendChatMessage = async () => {
            const inp = document.getElementById('chat-input');
            const text = inp.value.trim();
            if(!text) return;
            
            const ids = [currentUser.uid, activeChatUid].sort();
            const chatId = ids.join("_");
            
            await addDoc(collection(db, "chats", chatId, "messages"), {
                text, sender: currentUser.uid, date: serverTimestamp()
            });
            inp.value = "";
        };

        // --- UPLOAD & FEED & STORIES (STANDART) ---
        window.openUpload = (type) => { uploadType = type; document.getElementById('upload-file').click(); };
        document.getElementById('upload-file').onchange = (e) => { if(e.target.files[0]) { document.getElementById('upload-preview').src = URL.createObjectURL(e.target.files[0]); document.getElementById('modal-upload').style.display = 'flex'; } };
        window.performUpload = async () => {
            showLoading("Yükleniyor...");
            try {
                const file = document.getElementById('upload-file').files[0];
                const caption = document.getElementById('upload-caption').value;
                const url = await uploadToImgBB(file);
                await addDoc(collection(db, uploadType + "s"), { uid: currentUser.uid, imageUrl: url, caption, date: serverTimestamp() });
                closeModal('modal-upload'); document.getElementById('upload-caption').value = "";
            } catch(e) { alert(e.message); } finally { hideLoading(); }
        };

        function loadStories() {
            const list = document.getElementById('stories-list');
            onSnapshot(query(collection(db, "stories"), orderBy("date", "desc")), async (snap) => {
                list.innerHTML = "";
                const seen = new Set();
                const yesterday = new Date(Date.now() - 24*60*60*1000);
                for(const d of snap.docs) {
                    const s = d.data();
                    const sDate = s.date ? new Date(s.date.seconds*1000) : new Date();
                    if(sDate > yesterday && s.uid !== currentUser.uid && !seen.has(s.uid)) {
                        seen.add(s.uid);
                        const uSnap = await getDoc(doc(db, "users", s.uid));
                        if(uSnap.exists()) {
                             list.innerHTML += `<div class="story-item" onclick="window.open('${s.imageUrl}', '_blank')"><div class="story-ring"><img src="${uSnap.data().photoURL}" class="story-avatar"></div><div style="font-size:11px; margin-top:5px;">${uSnap.data().username}</div></div>`;
                        }
                    }
                }
            });
        }

        function loadFeed() {
            const cont = document.getElementById('feed-container');
            onSnapshot(query(collection(db, "posts"), orderBy("date", "desc")), async (snap) => {
                cont.innerHTML = "";
                for(const d of snap.docs) {
                    const p = d.data();
                    const uSnap = await getDoc(doc(db, "users", p.uid));
                    const u = uSnap.exists() ? uSnap.data() : {username:'...', photoURL:''};
                    cont.innerHTML += `<div class="post"><div class="post-header"><img src="${u.photoURL}" class="user-avatar-small"><span style="font-weight:600;">${u.username}</span></div><img src="${p.imageUrl}" class="post-img"><div style="padding:10px;"><span style="font-weight:600;">${u.username}</span> ${p.caption}</div></div>`;
                }
            });
        }

        // Profil Düzenleme
        window.openEditModal = () => {
            document.getElementById('edit-username').value = userData.username || "";
            document.getElementById('edit-fullname').value = userData.fullname || "";
            document.getElementById('edit-bio').value = userData.bio || "";
            document.getElementById('edit-preview').src = userData.photoURL || "https://via.placeholder.com/150";
            document.getElementById('modal-edit').style.display = 'flex';
        };
        document.getElementById('edit-file').onchange = (e) => { if(e.target.files[0]) document.getElementById('edit-preview').src = URL.createObjectURL(e.target.files[0]); };
        window.saveProfile = async () => {
            showLoading("Kaydediliyor...");
            try {
                const username = document.getElementById('edit-username').value;
                const fullname = document.getElementById('edit-fullname').value;
                const bio = document.getElementById('edit-bio').value;
                const file = document.getElementById('edit-file').files[0];
                let photoURL = userData.photoURL;
                if(file) photoURL = await uploadToImgBB(file);
                await setDoc(doc(db, "users", currentUser.uid), { username, fullname, bio, photoURL }, { merge: true });
                closeModal('modal-edit'); alert("Güncellendi!");
            } catch(e) { alert("Hata: " + e.message); } finally { hideLoading(); }
        };

        window.navTo = (id) => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); };
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    </script>
</body>
</html>
