<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Windows Live Messenger</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* --- MSN STİLİ (AESTHETIC) --- */
        :root {
            --msn-blue-top: #b2dcf8;
            --msn-blue-btm: #eaf5fc;
            --msn-border: #7aa5d6;
            --msn-header: linear-gradient(to bottom, #f5fbfe 0%, #c4def3 100%);
            --msn-bg: linear-gradient(to bottom, #86b4e5 0%, #4687ce 100%);
        }

        body { 
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--msn-bg); height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* UI RESET */
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; font-family: inherit; }

        /* EKRANLAR */
        .screen { display: none; flex: 1; flex-direction: column; height: 100%; padding: 10px; }
        .screen.active { display: flex; }

        /* PENCERE YAPISI */
        .window-frame {
            background: #fff; border: 1px solid #4a7ac9; border-radius: 6px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3); flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }

        .window-header {
            background: var(--msn-header); padding: 8px 10px; border-bottom: 1px solid #9fbddf;
            display: flex; justify-content: space-between; align-items: center; height: 40px;
        }
        .win-title { font-size: 13px; font-weight: bold; color: #333; text-shadow: 0 1px 0 #fff; display: flex; align-items: center; gap: 5px; }

        /* GİRİŞ EKRANI */
        .login-box {
            background: #eef7ff; border: 1px solid #8baeda; border-radius: 5px;
            padding: 20px; text-align: center; width: 100%; max-width: 320px; margin: auto;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }
        .msn-avatar-frame {
            width: 90px; height: 90px; border: 1px solid #aaa; padding: 3px; background: #fff;
            margin: 0 auto 15px; cursor: pointer; transition: 0.2s;
        }
        .msn-avatar-frame:hover { border-color: #4a7ac9; }
        .msn-avatar-img { width: 100%; height: 100%; object-fit: cover; }
        .msn-input { width: 100%; padding: 6px; border: 1px solid #8caee2; margin-bottom: 8px; font-size: 13px; }
        .msn-btn {
            background: linear-gradient(#fff, #e1e1e1); border: 1px solid #888; padding: 4px 15px; border-radius: 3px; font-size: 12px; margin-top: 5px;
        }
        .msn-btn:hover { border-color: #4a7ac9; background: #fdfdfd; }

        /* ANA EKRAN (KİŞİ LİSTESİ) */
        .my-card {
            background: linear-gradient(to right, #e3effa, #ffffff); padding: 10px;
            display: flex; align-items: center; border-bottom: 1px solid #bcd3ec;
        }
        .my-pic { width: 60px; height: 60px; border: 1px solid #fff; box-shadow: 0 0 3px #999; object-fit: cover; margin-right: 10px; cursor: pointer; }
        .my-details { flex: 1; overflow: hidden; }
        .my-nick { font-weight: bold; font-size: 14px; color: #000; cursor: pointer; }
        .my-status-msg { font-size: 11px; color: #666; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border: 1px solid transparent; }
        .my-status-msg:hover { border: 1px solid #ccc; background: #fff; }

        .list-area { flex: 1; background: #fff; overflow-y: auto; padding: 5px; }
        .group-title { font-size: 11px; font-weight: bold; color: #444; background: #f0f0f0; padding: 3px; margin-top: 5px; cursor: pointer; border: 1px solid #e0e0e0; }
        
        .contact-item {
            display: flex; align-items: center; padding: 6px; cursor: pointer; border: 1px solid transparent;
        }
        .contact-item:hover { background: #eef5fb; border: 1px solid #dcebf8; }
        .status-icon { width: 10px; height: 10px; margin-right: 6px; } /* Yeşil/Kırmızı/Gri kare */
        
        /* STATUS ICONS (CSS Shapes) */
        .s-online { background: #4cb050; border: 1px solid #2e7d32; }
        .s-busy { background: #e53935; border: 1px solid #c62828; }
        .s-offline { background: #bdbdbd; border: 1px solid #757575; }

        /* SOHBET EKRANI */
        .chat-history { flex: 1; background: #fff; padding: 10px; overflow-y: auto; font-size: 13px; line-height: 1.4; border-bottom: 1px solid #ccc; }
        .msg-block { margin-bottom: 8px; }
        .msg-header { color: #666; font-size: 11px; margin-bottom: 2px; }
        .msg-header b { color: #2e5f94; }
        .msg-content { margin-left: 5px; color: #000; }
        .system-msg { color: #e91e63; font-weight: bold; font-style: italic; text-align: center; margin: 10px 0; }

        .chat-tools { background: #f2f7fc; padding: 4px; display: flex; gap: 8px; border-bottom: 1px solid #e1e1e1; }
        .tool-icon { cursor: pointer; color: #555; font-size: 18px; }
        .tool-icon:hover { color: #000; }

        .chat-input-area { height: 60px; padding: 5px; display: flex; flex-direction: column; }
        .chat-textarea { flex: 1; border: none; resize: none; font-family: inherit; font-size: 12px; }
        .send-bar { text-align: right; background: #f2f7fc; padding: 3px; border-top: 1px solid #e1e1e1; }

        /* MODALS */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 999; justify-content: center; align-items: center;
        }
        .modal-box {
            background: #fff; border: 2px solid #4a7ac9; width: 90%; max-width: 300px; padding: 15px; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* TİTREŞİM ANIMASYONU */
        @keyframes nudgeShake {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-5px, -5px); }
            20% { transform: translate(5px, 5px); }
            30% { transform: translate(-5px, 5px); }
            40% { transform: translate(5px, -5px); }
            50% { transform: translate(0, 0); }
            100% { transform: translate(0, 0); }
        }
        .shaking { animation: nudgeShake 0.4s ease-in-out infinite; }
        
        /* BOTTOM NAV (Mobil Navigasyon) */
        .bottom-tabs { 
            display: flex; background: #eef5fb; border-top: 1px solid #9fbddf; height: 45px;
        }
        .tab-btn { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            border-right: 1px solid #dae6f2; cursor: pointer; color: #444;
        }
        .tab-btn:hover, .tab-btn.active { background: #fff; color: #000; font-weight: bold; }

    </style>
</head>
<body id="app-body">

    <audio id="snd-login" src="https://www.myinstants.com/media/sounds/msn-messenger-sign-in-sound.mp3"></audio>
    <audio id="snd-msg" src="https://www.myinstants.com/media/sounds/msn_messenger_new_message.mp3"></audio>
    <audio id="snd-nudge" src="https://www.myinstants.com/media/sounds/msn-nudge-sound.mp3"></audio>

    <div id="screen-auth" class="screen active" style="justify-content:center; align-items:center;">
        <div class="login-box">
            <h2 style="color:#3465a4; margin-top:0;">Windows Live Messenger</h2>
            <div class="msn-avatar-frame" onclick="document.getElementById('auth-file').click()">
                <img id="auth-preview" src="https://via.placeholder.com/90" class="msn-avatar-img">
            </div>
            <input type="file" id="auth-file" hidden accept="image/*">
            <input type="email" id="auth-email" class="msn-input" placeholder="E-posta adresi">
            <input type="password" id="auth-pass" class="msn-input" placeholder="Parola">
            <button onclick="authAction('login')" class="msn-btn">Oturum Aç</button>
            <button onclick="authAction('signup')" class="msn-btn">Kaydol</button>
            <div id="loading-text" style="font-size:11px; color:#666; margin-top:10px; display:none;">Yükleniyor...</div>
        </div>
    </div>

    <div id="screen-main" class="screen">
        <div class="window-frame">
            <div class="window-header">
                <span class="win-title"><span class="material-icons" style="font-size:16px; margin-right:5px;">person</span> Messenger</span>
                <span class="material-icons" onclick="logout()" style="font-size:16px; cursor:pointer;">close</span>
            </div>
            
            <div class="my-card">
                <img id="my-pic" src="" class="my-pic" onclick="openProfileEdit()">
                <div class="my-details">
                    <div id="my-nick" class="my-nick" onclick="openProfileEdit()">Yükleniyor...</div>
                    <div id="my-msg" class="my-status-msg" onclick="editPersonalMsg()">[Kişisel bir ileti yazın]</div>
                    <select id="my-status-select" onchange="updateStatus(this.value)" style="border:none; background:transparent; font-size:11px; margin-top:3px;">
                        <option value="online">🟢 Çevrimiçi</option>
                        <option value="busy">⛔ Meşgul</option>
                        <option value="away">🟡 Dışarıda</option>
                        <option value="offline">⚪ Çevrimdışı Görün</option>
                    </select>
                </div>
            </div>

            <div style="background:#fcfcfc; border-bottom:1px solid #ddd; display:flex; padding:5px; font-size:11px; gap:10px;">
                <span onclick="showTab('contacts')" style="cursor:pointer; font-weight:bold; color:#333;">Kişiler</span>
                <span onclick="showTab('add')" style="cursor:pointer; color:#666;">Arkadaş Ekle</span>
                <span onclick="showTab('requests')" style="cursor:pointer; color:#666;">İstekler (<span id="req-count">0</span>)</span>
            </div>

            <div id="tab-contacts" class="list-area">
                <div class="group-title">▼ Çevrimiçi</div>
                <div id="list-online"></div>
                <div class="group-title" style="margin-top:10px;">▼ Çevrimdışı</div>
                <div id="list-offline"></div>
            </div>

            <div id="tab-add" class="list-area" style="display:none; padding:15px; text-align:center;">
                <h4 style="margin:0 0 10px 0; color:#4a7ac9;">Kişi Ekle</h4>
                <input type="text" id="search-input" class="msn-input" placeholder="E-posta veya Ad ara...">
                <button onclick="searchUsers()" class="msn-btn">Ara</button>
                <div id="search-results" style="margin-top:15px; text-align:left;"></div>
            </div>

            <div id="tab-requests" class="list-area" style="display:none;">
                <div class="group-title">Bekleyen İstekler</div>
                <div id="request-list"></div>
            </div>

        </div>
    </div>

    <div id="screen-chat" class="screen">
        <div class="window-frame">
            <div class="window-header">
                <span class="win-title">
                    <span class="material-icons" style="font-size:16px; margin-right:5px;">chat</span>
                    <span id="chat-title-name">...</span>
                </span>
                <span class="material-icons" onclick="closeChat()" style="font-size:16px; cursor:pointer;">close</span>
            </div>
            
            <div class="chat-tools">
                <span class="tool-icon material-icons" onclick="sendNudge()" title="Titreşim Gönder">vibration</span>
                <span class="tool-icon material-icons" onclick="document.getElementById('file-input').click()" title="Fotoğraf Gönder">image</span>
                <span class="tool-icon material-icons" title="İfadeler">sentiment_satisfied_alt</span>
            </div>
            <input type="file" id="file-input" hidden accept="image/*">

            <div id="chat-history" class="chat-history"></div>

            <div class="chat-input-area">
                <textarea id="chat-msg-input" class="chat-textarea"></textarea>
            </div>
            <div class="send-bar">
                <button onclick="sendMessage()" class="msn-btn">Gönder</button>
            </div>
        </div>
    </div>

    <div id="modal-profile" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0; color:#4a7ac9;">Seçenekler</h3>
            <div style="text-align:center; margin-bottom:10px;">
                <img id="edit-img-prev" src="" style="width:60px; height:60px; border:1px solid #aaa;">
                <div style="font-size:10px; color:blue; cursor:pointer;" onclick="document.getElementById('edit-file').click()">Resmi Değiştir</div>
                <input type="file" id="edit-file" hidden>
            </div>
            <label style="font-size:11px;">Görüntülenen Ad:</label>
            <input type="text" id="edit-nick" class="msn-input">
            <label style="font-size:11px;">Kişisel İleti:</label>
            <input type="text" id="edit-msg" class="msn-input">
            <div style="text-align:right;">
                <button onclick="saveProfile()" class="msn-btn">Tamam</button>
                <button onclick="document.getElementById('modal-profile').style.display='none'" class="msn-btn">İptal</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, getDoc, getDocs, where, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // IMGBB KEY (Senin Keyin)
        const IMGBB_KEY = "4e42bfb4bfa830f09e932aa64cc20bb6";

        const app = initializeApp({
            apiKey: "AIzaSyA90T44N_om_KnTs3Wg06m8pBry0L20nVw",
            authDomain: "sosyal-medya-a46b6.firebaseapp.com",
            projectId: "sosyal-medya-a46b6",
            storageBucket: "sosyal-medya-a46b6.firebasestorage.app",
            messagingSenderId: "990331063740",
            appId: "1:990331063740:web:e18de69584fc82825aafb9"
        });

        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = {};
        let activeChatId = null;
        let activeChatUser = null; // Karşı tarafın uid'si

        // --- SESLER ---
        const playSnd = (id) => { document.getElementById(id).currentTime=0; document.getElementById(id).play().catch(()=>{}); };

        // --- YARDIMCI ---
        const uploadImg = async (file) => {
            const fd = new FormData(); fd.append("image", file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
            const data = await res.json();
            if(data.success) return data.data.url;
            throw new Error("Resim yüklenemedi");
        };

        // --- AUTH ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                // Kendini dinle
                onSnapshot(doc(db, "users", user.uid), (s) => {
                    if(s.exists()) {
                        userData = s.data();
                        updateMyUI();
                    }
                });
                // Online yap
                await updateDoc(doc(db, "users", user.uid), { status: 'online' });
                playSnd('snd-login');

                document.getElementById('screen-auth').classList.remove('active');
                document.getElementById('screen-main').classList.add('active');
                loadFriends();
                loadRequests();
            } else {
                document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
                document.getElementById('screen-auth').classList.add('active');
            }
        });

        function updateMyUI() {
            document.getElementById('my-pic').src = userData.photoURL || "https://via.placeholder.com/60";
            document.getElementById('my-nick').innerText = userData.username;
            document.getElementById('my-msg').innerText = userData.personalMsg || "[Kişisel bir ileti yazın]";
            document.getElementById('my-status-select').value = userData.status || 'online';
        }

        window.authAction = async (type) => {
            const e = document.getElementById('auth-email').value;
            const p = document.getElementById('auth-pass').value;
            if(!e || !p) return alert("Bilgileri girin");
            document.getElementById('loading-text').style.display='block';
            
            try {
                if(type === 'login') await signInWithEmailAndPassword(auth, e, p);
                else {
                    const c = await createUserWithEmailAndPassword(auth, e, p);
                    let url = "https://via.placeholder.com/150";
                    const f = document.getElementById('auth-file').files[0];
                    if(f) url = await uploadImg(f);
                    
                    await setDoc(doc(db, "users", c.user.uid), {
                        uid: c.user.uid, email: e, username: e.split('@')[0], 
                        photoURL: url, status: 'online', personalMsg: '',
                        friends: [] 
                    }, {merge:true});
                }
            } catch(err) { alert(err.message); }
            document.getElementById('loading-text').style.display='none';
        };

        window.logout = async () => {
            if(currentUser) await updateDoc(doc(db, "users", currentUser.uid), { status: 'offline' });
            signOut(auth);
        };

        // --- ARKADAŞLIK SİSTEMİ ---
        
        // 1. Arkadaşları Listele
        function loadFriends() {
            // Arkadaş listesi users içinde array olarak tutuluyor (Basit model)
            // Daha gelişmişi: subcollection
            onSnapshot(doc(db, "users", currentUser.uid), async (s) => {
                const data = s.data();
                const friends = data.friends || [];
                
                const onlineDiv = document.getElementById('list-online');
                const offlineDiv = document.getElementById('list-offline');
                onlineDiv.innerHTML = ""; offlineDiv.innerHTML = "";

                for(const friendId of friends) {
                    const fSnap = await getDoc(doc(db, "users", friendId));
                    if(fSnap.exists()) {
                        const f = fSnap.data();
                        const st = f.status || 'offline';
                        const dotClass = st === 'online' ? 's-online' : (st === 'busy' ? 's-busy' : 's-offline');
                        
                        const html = `
                            <div class="contact-item" onclick="openChat('${f.uid}', '${f.username}')">
                                <div class="status-icon ${dotClass}"></div>
                                <div style="flex:1;">
                                    <span style="font-weight:bold; font-size:13px;">${f.username}</span>
                                    <span style="color:#666; font-size:11px; margin-left:5px;">${st === 'busy' ? '(Meşgul)' : ''}</span>
                                    <div style="font-size:10px; color:#888; font-style:italic;">${f.personalMsg || ''}</div>
                                </div>
                            </div>
                        `;
                        
                        if(st === 'offline') offlineDiv.innerHTML += html;
                        else onlineDiv.innerHTML += html;
                    }
                }
            });
        }

        // 2. Kullanıcı Ara
        window.searchUsers = async () => {
            const val = document.getElementById('search-input').value.toLowerCase();
            const res = document.getElementById('search-results'); res.innerHTML = "Aranıyor...";
            
            // Tüm kullanıcıları çekip filtrele (Küçük ölçek için)
            const snap = await getDocs(collection(db, "users"));
            res.innerHTML = "";
            snap.forEach(d => {
                const u = d.data();
                if(u.uid !== currentUser.uid && (u.email.includes(val) || u.username.toLowerCase().includes(val))) {
                    res.innerHTML += `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:5px; border-bottom:1px solid #eee;">
                            <div>
                                <b>${u.username}</b><br><small>${u.email}</small>
                            </div>
                            <button onclick="sendFriendRequest('${u.uid}')" class="msn-btn">Ekle</button>
                        </div>
                    `;
                }
            });
            if(res.innerHTML === "") res.innerHTML = "Sonuç bulunamadı.";
        };

        // 3. İstek Gönder
        window.sendFriendRequest = async (targetUid) => {
            const reqId = [currentUser.uid, targetUid].sort().join("_");
            await setDoc(doc(db, "friend_requests", reqId), {
                from: currentUser.uid, to: targetUid, status: 'pending'
            });
            alert("İstek gönderildi!");
        };

        // 4. İstekleri Listele
        function loadRequests() {
            const q = query(collection(db, "friend_requests"), where("to", "==", currentUser.uid), where("status", "==", "pending"));
            onSnapshot(q, async (snap) => {
                const div = document.getElementById('request-list'); 
                div.innerHTML = "";
                document.getElementById('req-count').innerText = snap.size;

                for(const d of snap.docs) {
                    const req = d.data();
                    const uSnap = await getDoc(doc(db, "users", req.from));
                    const u = uSnap.data();
                    
                    div.innerHTML += `
                        <div style="padding:10px; border-bottom:1px solid #ccc; background:#fff;">
                            <b>${u.username}</b> sizi eklemek istiyor.
                            <div style="margin-top:5px;">
                                <button onclick="acceptRequest('${d.id}', '${req.from}')" class="msn-btn">Kabul Et</button>
                                <button onclick="rejectRequest('${d.id}')" class="msn-btn">Reddet</button>
                            </div>
                        </div>
                    `;
                }
            });
        }

        window.acceptRequest = async (docId, friendUid) => {
            // İki tarafın da friends arrayine ekle
            const myRef = doc(db, "users", currentUser.uid);
            const friendRef = doc(db, "users", friendUid);
            
            // Arkadaş listelerini güncelle (ArrayUnion kullanmak daha iyi ama basit push yapalım)
            // Önce oku
            const me = (await getDoc(myRef)).data();
            const him = (await getDoc(friendRef)).data();
            
            const myFriends = me.friends || [];
            const hisFriends = him.friends || [];
            
            if(!myFriends.includes(friendUid)) myFriends.push(friendUid);
            if(!hisFriends.includes(currentUser.uid)) hisFriends.push(currentUser.uid);
            
            await updateDoc(myRef, { friends: myFriends });
            await updateDoc(friendRef, { friends: hisFriends });
            
            // İsteği sil
            await deleteDoc(doc(db, "friend_requests", docId));
            alert("Kişi eklendi!");
        };

        window.rejectRequest = async (id) => await deleteDoc(doc(db, "friend_requests", id));


        // --- CHAT ---
        window.openChat = (uid, name) => {
            activeChatUser = uid;
            document.getElementById('chat-title-name').innerText = name;
            document.getElementById('screen-main').classList.remove('active');
            document.getElementById('screen-chat').classList.add('active');
            
            activeChatId = [currentUser.uid, uid].sort().join("_");
            
            onSnapshot(query(collection(db, "chats", activeChatId, "messages"), orderBy("date", "asc")), (snap) => {
                const hist = document.getElementById('chat-history');
                hist.innerHTML = "";
                snap.docChanges().forEach((c) => {
                    if(c.type === 'added') {
                        const m = c.doc.data();
                        
                        if(m.type === 'nudge') {
                            hist.innerHTML += `<div class="system-msg">--- ${m.senderName} size bir titreşim gönderdi! ---</div>`;
                            if(m.sender !== currentUser.uid) {
                                playSnd('snd-nudge');
                                document.getElementById('app-body').classList.add('shaking');
                                setTimeout(()=>document.getElementById('app-body').classList.remove('shaking'), 1000);
                            }
                        } else if (m.type === 'image') {
                            hist.innerHTML += `
                                <div class="msg-block">
                                    <div class="msg-header"><b>${m.senderName}</b> diyor ki:</div>
                                    <div class="msg-content"><img src="${m.text}" style="max-width:200px; border:2px solid #fff; box-shadow:0 0 5px #ccc;"></div>
                                </div>
                            `;
                            if(m.sender !== currentUser.uid) playSnd('snd-msg');
                        } else {
                            hist.innerHTML += `
                                <div class="msg-block">
                                    <div class="msg-header"><b>${m.senderName}</b> diyor ki:</div>
                                    <div class="msg-content">${m.text}</div>
                                </div>
                            `;
                            if(m.sender !== currentUser.uid) playSnd('snd-msg');
                        }
                    }
                });
                hist.scrollTop = hist.scrollHeight;
            });
        };

        window.sendMessage = async () => {
            const txt = document.getElementById('chat-msg-input').value.trim();
            if(!txt) return;
            await addDoc(collection(db, "chats", activeChatId, "messages"), {
                text: txt, sender: currentUser.uid, senderName: userData.username, type: 'text', date: serverTimestamp()
            });
            document.getElementById('chat-msg-input').value = "";
        };

        window.sendNudge = async () => {
             await addDoc(collection(db, "chats", activeChatId, "messages"), {
                text: "TITRESIM", sender: currentUser.uid, senderName: userData.username, type: 'nudge', date: serverTimestamp()
            });
            // Kendim de salla
            document.getElementById('app-body').classList.add('shaking');
            setTimeout(()=>document.getElementById('app-body').classList.remove('shaking'), 1000);
        };
        
        document.getElementById('file-input').onchange = async (e) => {
             if(e.target.files[0]) {
                 const url = await uploadImg(e.target.files[0]);
                 await addDoc(collection(db, "chats", activeChatId, "messages"), {
                    text: url, sender: currentUser.uid, senderName: userData.username, type: 'image', date: serverTimestamp()
                });
             }
        };

        window.closeChat = () => {
            document.getElementById('screen-chat').classList.remove('active');
            document.getElementById('screen-main').classList.add('active');
        };

        // --- PROFİL DÜZENLEME ---
        window.openProfileEdit = () => {
            document.getElementById('edit-nick').value = userData.username;
            document.getElementById('edit-msg').value = userData.personalMsg || "";
            document.getElementById('edit-img-prev').src = userData.photoURL;
            document.getElementById('modal-profile').style.display = 'flex';
        };
        document.getElementById('edit-file').onchange = (e) => {
             if(e.target.files[0]) document.getElementById('edit-img-prev').src = URL.createObjectURL(e.target.files[0]);
        };
        window.saveProfile = async () => {
            const nick = document.getElementById('edit-nick').value;
            const msg = document.getElementById('edit-msg').value;
            const f = document.getElementById('edit-file').files[0];
            let url = userData.photoURL;
            if(f) url = await uploadImg(f);
            
            await updateDoc(doc(db, "users", currentUser.uid), {
                username: nick, personalMsg: msg, photoURL: url
            });
            document.getElementById('modal-profile').style.display = 'none';
        };
        
        // Kişisel ileti kısayolu
        window.editPersonalMsg = async () => {
            const m = prompt("İletiniz:", userData.personalMsg);
            if(m !== null) await updateDoc(doc(db, "users", currentUser.uid), { personalMsg: m });
        };
        
        // Durum güncelle
        window.updateStatus = async (val) => {
            await updateDoc(doc(db, "users", currentUser.uid), { status: val });
        };

        // TAB GECISLERI
        window.showTab = (tab) => {
            document.querySelectorAll('.list-area').forEach(e => e.style.display = 'none');
            document.getElementById('tab-'+tab).style.display = 'block';
        };

    </script>
</body>
</html>
