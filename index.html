<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSN Messenger</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* --- MSN AESTHETICS --- */
        :root {
            --msn-blue: #ebf4fb;
            --msn-border: #6e99c3;
            --msn-header-top: #ecf6fd;
            --msn-header-btm: #d2e7fa;
            --msn-text: #222;
        }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Verdana', sans-serif; 
            background: linear-gradient(to bottom, #7db3e8 0%, #3e88d0 100%);
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* Ekranlar */
        .screen { display: none; flex: 1; flex-direction: column; background: #fff; height: 100%; }
        .screen.active { display: flex; }

        /* MSN PENCERE STİLİ */
        .msn-window {
            flex: 1; display: flex; flex-direction: column;
            background: #fff;
            border: 2px solid #5a8dc6;
            border-radius: 5px;
            margin: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .msn-header {
            background: linear-gradient(to bottom, #e3effa 0%, #b6d5f3 100%);
            padding: 8px; border-bottom: 1px solid #9fbddf;
            display: flex; justify-content: space-between; align-items: center;
        }
        .msn-logo-text { color: #2e5f94; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 0 #fff; display: flex; align-items: center; gap: 5px; }

        /* GİRİŞ EKRANI */
        .login-box {
            background: #f1f7fc; padding: 20px; border-radius: 8px;
            border: 1px solid #8baeda; text-align: center;
            width: 90%; max-width: 350px; margin: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .avatar-frame {
            width: 80px; height: 80px; background: #fff; border: 1px solid #999; padding: 3px;
            margin: 0 auto 15px; cursor: pointer;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; border: 1px solid #ccc; }
        .msn-input {
            width: 100%; padding: 5px; margin-bottom: 10px; border: 1px solid #7f9db9;
            font-family: 'Verdana'; font-size: 12px;
        }
        .msn-btn {
            background: linear-gradient(to bottom, #fff 0%, #ddd 100%);
            border: 1px solid #7f9db9; padding: 5px 15px; cursor: pointer; font-size: 12px; border-radius: 3px;
        }
        .msn-btn:active { background: #ccc; }

        /* KİŞİ LİSTESİ (ANA EKRAN) */
        .user-card {
            background: linear-gradient(to bottom, #dbeaf9 0%, #c4ddf6 100%);
            padding: 10px; display: flex; align-items: center; border-bottom: 1px solid #abcbe8;
        }
        .my-avatar { width: 50px; height: 50px; border: 1px solid #fff; margin-right: 10px; object-fit: cover; cursor: pointer;}
        .my-info { flex: 1; }
        .my-name { font-weight: bold; font-size: 14px; color: #000; display: block; }
        .personal-msg { 
            font-size: 11px; color: #666; font-style: italic; cursor: pointer; border: 1px solid transparent; padding: 2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; display: block;
        }
        .personal-msg:hover { border: 1px solid #999; background: #fff; }

        .contact-group { background: #fdfdfd; flex: 1; overflow-y: auto; padding: 5px; }
        .group-header { font-size: 11px; font-weight: bold; color: #2e5f94; margin-bottom: 5px; cursor: pointer; }
        
        .contact-item {
            display: flex; align-items: center; padding: 5px; cursor: pointer;
            border: 1px solid transparent;
        }
        .contact-item:hover { background: #eef6fb; border: 1px solid #dcebf8; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; border: 1px solid #666; }
        .st-online { background: #00cc00; }
        .st-busy { background: #cc0000; }
        .st-offline { background: #ccc; }

        /* SOHBET PENCERESİ */
        .chat-area { flex: 1; background: #fff; overflow-y: auto; padding: 10px; border-top: 1px solid #9fbddf; border-bottom: 1px solid #9fbddf; }
        .msg-line { margin-bottom: 5px; font-size: 12px; }
        .msg-sender { color: #2e5f94; font-weight: bold; }
        .msg-text { color: #000; margin-left: 5px; }
        .msg-system { color: #f00; font-weight: bold; font-style: italic; text-align: center; margin: 10px 0; }
        
        .toolbar { background: #e3effa; padding: 5px; display: flex; gap: 10px; align-items: center; }
        .tool-btn { border: 1px solid transparent; background: none; cursor: pointer; padding: 2px; }
        .tool-btn:hover { border: 1px solid #7f9db9; background: #fff; }

        .input-area { height: 60px; padding: 5px; background: #fff; display: flex; }
        .chat-input { width: 100%; height: 100%; border: none; font-family: 'Verdana'; font-size: 12px; resize: none; outline: none; }
        .send-btn-area { background: #e3effa; padding: 5px; text-align: right; border-top: 1px solid #dcebf8; }

        /* Titreşim Animasyonu */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shaking { animation: shake 0.5s; animation-iteration-count: infinite; }

        /* Durum Seçici */
        .status-select { background: transparent; border: none; font-size: 10px; color: #555; cursor: pointer; }

        /* Loading */
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 999; align-items: center; justify-content: center; }
    </style>
</head>
<body id="main-body">

    <div id="loading" class="loading-overlay">
        <img src="https://media.tenor.com/On7kvXhzml4AAAAj/loading-gif.gif" width="30">
    </div>

    <div id="screen-auth" class="screen active" style="background:transparent; justify-content:center;">
        <div class="login-box">
            <h2 style="color:#2e5f94; margin-top:0;">MSN Messenger</h2>
            <div class="avatar-frame" onclick="document.getElementById('auth-file').click()">
                <img id="auth-preview" src="https://via.placeholder.com/80" class="avatar-img">
            </div>
            <div style="font-size:10px; color:#666; margin-bottom:5px;">Resim seçmek için kutuya tıkla</div>
            <input type="file" id="auth-file" hidden accept="image/*">
            
            <input type="email" id="auth-email" class="msn-input" placeholder="E-posta Adresi">
            <input type="password" id="auth-pass" class="msn-input" placeholder="Parola">
            
            <button onclick="authAction('login')" class="msn-btn">Oturum Aç</button>
            <button onclick="authAction('signup')" class="msn-btn">Kaydol</button>
            
            <div style="margin-top:15px; font-size:11px; color:#666;">
                <label><input type="checkbox" checked> Parolamı anımsa</label><br>
                <label><input type="checkbox" checked> Otomatik oturum aç</label>
            </div>
        </div>
    </div>

    <div id="screen-main" class="screen" style="background:transparent; padding:5px;">
        <div class="msn-window">
            <div class="msn-header">
                <div class="msn-logo-text">
                    <span class="material-icons" style="font-size:16px;">people</span> MSN Messenger
                </div>
                <span class="material-icons" onclick="logout()" style="cursor:pointer; color:#555; font-size:16px;">close</span>
            </div>
            
            <div class="user-card">
                <img id="my-avatar" src="" class="my-avatar">
                <div class="my-info">
                    <span id="my-name" class="my-name">...</span>
                    <span id="my-msg" class="personal-msg" onclick="editPersonalMsg()">[Kişisel ileti yazmak için tıkla]</span>
                    
                    <select id="my-status" class="status-select" onchange="updateStatus(this.value)">
                        <option value="online">🟢 Çevrimiçi</option>
                        <option value="busy">⛔ Meşgul</option>
                        <option value="away">🟡 Dışarıda</option>
                    </select>
                </div>
            </div>

            <div class="contact-group">
                <div class="group-header">▼ Çevrimiçi Kişiler (<span id="online-count">0</span>)</div>
                <div id="contact-list">
                    </div>
            </div>
            
            <div style="background:#f1f7fc; padding:5px; text-align:center; border-top:1px solid #9fbddf; font-size:10px; color:#666;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Windows_Live_Messenger_logo.svg/1024px-Windows_Live_Messenger_logo.svg.png" width="20" style="vertical-align:middle;">
                Aşkınız MSN ile daha hızlı.
            </div>
        </div>
    </div>

    <div id="screen-chat" class="screen" style="background:transparent; padding:5px;">
        <div class="msn-window">
            <div class="msn-header">
                <div class="msn-logo-text">
                    <img id="chat-header-img" src="" style="width:20px; height:20px; border:1px solid #fff; margin-right:5px;">
                    <span id="chat-header-name">...</span> ile Sohbet
                </div>
                <span class="material-icons" onclick="closeChat()" style="cursor:pointer; color:#555; font-size:16px;">close</span>
            </div>

            <div class="toolbar">
                <button class="tool-btn" title="Titreşim Gönder" onclick="sendNudge()">
                    <span class="material-icons" style="font-size:18px; color:#2e5f94;">vibration</span>
                </button>
                <button class="tool-btn" title="İfade Gönder" onclick="alert('Yakında...')">
                    <span class="material-icons" style="font-size:18px; color:#ffa500;">sentiment_satisfied</span>
                </button>
                <button class="tool-btn" title="Dosya Gönder" onclick="openUpload()">
                    <span class="material-icons" style="font-size:18px; color:#2e5f94;">attach_file</span>
                </button>
            </div>
            
            <div id="chat-box" class="chat-area"></div>
            
            <div class="input-area">
                <textarea id="chat-input" class="chat-input" placeholder="Bir ileti yazın..."></textarea>
            </div>
            <div class="send-btn-area">
                <button onclick="sendMessage()" class="msn-btn" style="font-weight:bold;">Gönder</button>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" hidden>

    <audio id="sound-login" src="https://www.myinstants.com/media/sounds/msn-messenger-sign-in-sound.mp3"></audio>
    <audio id="sound-msg" src="https://www.myinstants.com/media/sounds/msn_messenger_new_message.mp3"></audio>
    <audio id="sound-nudge" src="https://www.myinstants.com/media/sounds/msn-nudge-sound.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, getDoc, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const IMGBB_KEY = "4e42bfb4bfa830f09e932aa64cc20bb6";

        const app = initializeApp({
            apiKey: "AIzaSyA90T44N_om_KnTs3Wg06m8pBry0L20nVw",
            authDomain: "sosyal-medya-a46b6.firebaseapp.com",
            projectId: "sosyal-medya-a46b6",
            storageBucket: "sosyal-medya-a46b6.firebasestorage.app",
            messagingSenderId: "990331063740",
            appId: "1:990331063740:web:e18de69584fc82825aafb9"
        });

        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = {};
        let activeChatUid = null;
        let activeChatId = null;

        // --- SESLER ---
        const playSound = (id) => {
            const audio = document.getElementById(id);
            if(audio) { audio.currentTime = 0; audio.play().catch(e => console.log(e)); }
        };

        // --- YARDIMCI ---
        const loading = (s) => document.getElementById('loading').style.display = s ? 'flex' : 'none';
        const uploadImg = async (file) => {
            const fd = new FormData(); fd.append("image", file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
            const data = await res.json();
            if(data.success) return data.data.url;
            throw new Error("Yükleme hatası");
        };

        // --- AUTH ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                // Kullanıcıyı dinle (Durum, kişisel ileti)
                onSnapshot(doc(db, "users", user.uid), (s) => {
                    if (s.exists()) {
                        userData = s.data();
                        document.getElementById('my-avatar').src = userData.photoURL || "https://via.placeholder.com/60";
                        document.getElementById('my-name').innerText = userData.username;
                        document.getElementById('my-msg').innerText = userData.personalMsg || "[Kişisel ileti yazmak için tıkla]";
                        document.getElementById('my-status').value = userData.status || "online";
                    }
                });

                // Kendimi Online Yap
                await updateDoc(doc(db, "users", user.uid), { status: 'online' });
                playSound('sound-login');

                navTo('screen-main');
                loadContacts();
            } else {
                navTo('screen-auth');
            }
        });

        // Giriş/Kayıt İşlemleri
        document.getElementById('auth-file').onchange = (e) => {
            if(e.target.files[0]) document.getElementById('auth-preview').src = URL.createObjectURL(e.target.files[0]);
        };

        window.authAction = async (type) => {
            const e = document.getElementById('auth-email').value;
            const p = document.getElementById('auth-pass').value;
            if(!e || !p) return alert("Bilgileri girin");
            loading(true);
            try {
                if(type === 'login') await signInWithEmailAndPassword(auth, e, p);
                else {
                    const c = await createUserWithEmailAndPassword(auth, e, p);
                    let photoURL = "https://via.placeholder.com/80";
                    const f = document.getElementById('auth-file').files[0];
                    if(f) photoURL = await uploadImg(f);
                    
                    await setDoc(doc(db, "users", c.user.uid), {
                        uid: c.user.uid, email: e, username: e.split('@')[0], 
                        photoURL: photoURL, status: 'online', personalMsg: ''
                    }, {merge:true});
                }
            } catch(err) { alert(err.message); }
            loading(false);
        };

        window.logout = async () => {
            if(currentUser) await updateDoc(doc(db, "users", currentUser.uid), { status: 'offline' });
            signOut(auth);
        };

        // --- ANA EKRAN (KİŞİLER) ---
        function loadContacts() {
            // Basitlik için tüm kullanıcıları çekip listeliyoruz
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('contact-list');
                list.innerHTML = "";
                let count = 0;

                snap.forEach(d => {
                    const u = d.data();
                    if (u.uid !== currentUser.uid) {
                        const stClass = u.status === 'online' ? 'st-online' : (u.status === 'busy' ? 'st-busy' : 'st-offline');
                        if(u.status !== 'offline') count++; // Sadece aktifleri say (isteğe bağlı)

                        list.innerHTML += `
                            <div class="contact-item" onclick="openChat('${u.uid}', '${u.username}', '${u.photoURL}')">
                                <div class="status-dot ${stClass}"></div>
                                <div>
                                    <span style="font-weight:bold; font-size:12px;">${u.username}</span>
                                    <span style="color:#666; font-size:11px;"> - ${u.status === 'online' ? '(Çevrimiçi)' : (u.status==='busy'?'(Meşgul)':'(Çevrimdışı)')}</span>
                                    <div style="font-size:10px; color:#888; font-style:italic;">${u.personalMsg || ''}</div>
                                </div>
                            </div>
                        `;
                    }
                });
                document.getElementById('online-count').innerText = count;
            });
        }

        // Kişisel İleti Düzenle
        window.editPersonalMsg = async () => {
            const msg = prompt("Kişisel iletiniz:", userData.personalMsg || "");
            if(msg !== null) {
                await updateDoc(doc(db, "users", currentUser.uid), { personalMsg: msg });
            }
        };

        // Durum Güncelle
        window.updateStatus = async (val) => {
            await updateDoc(doc(db, "users", currentUser.uid), { status: val });
        };

        // --- SOHBET ---
        window.openChat = (uid, name, photo) => {
            activeChatUid = uid;
            activeChatId = [currentUser.uid, uid].sort().join("_");
            
            document.getElementById('chat-header-name').innerText = name;
            document.getElementById('chat-header-img').src = photo;
            navTo('screen-chat');

            // Mesajları Dinle
            onSnapshot(query(collection(db, "chats", activeChatId, "messages"), orderBy("date", "asc")), (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = "";
                
                snap.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const m = change.doc.data();
                        
                        // TİTREŞİM KONTROLÜ
                        if (m.type === 'nudge') {
                            box.innerHTML += `<div class="msg-system">--- ${m.senderName} size bir titreşim gönderdi! ---</div>`;
                            // Eğer ben göndermediysem ekranı salla
                            if (m.sender !== currentUser.uid) {
                                playSound('sound-nudge');
                                document.getElementById('main-body').classList.add('shaking');
                                setTimeout(() => document.getElementById('main-body').classList.remove('shaking'), 1000); // 1 sn salla dur
                            }
                        } 
                        // RESİM
                        else if (m.type === 'image') {
                            box.innerHTML += `
                                <div class="msg-line">
                                    <span class="msg-sender">${m.senderName}:</span><br>
                                    <img src="${m.text}" style="max-width:200px; border:2px solid #fff; box-shadow:0 0 5px #999;">
                                </div>`;
                            if(m.sender !== currentUser.uid) playSound('sound-msg');
                        }
                        // NORMAL MESAJ
                        else {
                            box.innerHTML += `
                                <div class="msg-line">
                                    <span class="msg-sender">${m.senderName}:</span>
                                    <span class="msg-text" style="color:${m.color || '#000'}">${m.text}</span>
                                </div>`;
                            if(m.sender !== currentUser.uid) playSound('sound-msg');
                        }
                    }
                });
                box.scrollTop = box.scrollHeight;
            });
        };

        window.sendMessage = async () => {
            const inp = document.getElementById('chat-input');
            const txt = inp.value.trim();
            if(!txt) return;

            await addDoc(collection(db, "chats", activeChatId, "messages"), {
                text: txt, sender: currentUser.uid, senderName: userData.username,
                type: 'text', date: serverTimestamp()
            });
            inp.value = "";
        };

        // Titreşim Gönder
        window.sendNudge = async () => {
            await addDoc(collection(db, "chats", activeChatId, "messages"), {
                text: "TITRESIM", sender: currentUser.uid, senderName: userData.username,
                type: 'nudge', date: serverTimestamp()
            });
            // Kendim de sesi duyayım ve sallanayım (isteğe bağlı, MSN'de iki taraf da sallanırdı)
             document.getElementById('main-body').classList.add('shaking');
             setTimeout(() => document.getElementById('main-body').classList.remove('shaking'), 1000);
        };

        // Dosya Gönder
        window.openUpload = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = async (e) => {
            if(!e.target.files[0]) return;
            loading(true);
            try {
                const url = await uploadImg(e.target.files[0]);
                await addDoc(collection(db, "chats", activeChatId, "messages"), {
                    text: url, sender: currentUser.uid, senderName: userData.username,
                    type: 'image', date: serverTimestamp()
                });
            } catch(err){ alert("Hata: "+err.message); }
            loading(false);
        };

        window.closeChat = () => navTo('screen-main');
        window.navTo = (id) => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); };

    </script>
</body>
</html>
